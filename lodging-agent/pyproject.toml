[project]
name = "lodging-agent"
version = "0.1.0"
description = "Deep research de alojamientos: brief de viaje -> top 5 justificado con evidencia real (SerpAPI Google Hotels + deepagents)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6,<0.7",
    "langchain>=1.3,<2",
    "langchain-anthropic>=1.5,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "langsmith>=0.3",
    "trafilatura>=2.2.0",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lodging"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC240"]
